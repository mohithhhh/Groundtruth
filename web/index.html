<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Groundtruth ranks Bengaluru's 369 wards by heat risk from satellite data, answers planning questions with every figure verified, and plans cooling interventions within a budget." />
    <meta name="theme-color" content="#E9EEEA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12211E" media="(prefers-color-scheme: dark)" />
    <title>Groundtruth — ward heat planning for Bengaluru</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600&family=Hanken+Grotesk:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("groundtruth.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
